name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The claude CLI is not installed here, so the plugin validate and test
      # cases skip. Run them locally before committing.
      - name: Run tests
        run: node --test "tests/*.test.mjs"
